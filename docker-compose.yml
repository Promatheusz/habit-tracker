services:
  backend:
    build: ./backend
    ports:
      - "5001:5000"
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
      - sqlite_data:/usr/src/app/data # Persystencja bazy SQLite
    environment:
      - NODE_ENV=development
      - DB_PATH=/usr/src/app/data/database.sqlite

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true # Ważne dla odświeżania kodu na Windows
    depends_on:
      - backend

volumes:
  sqlite_data:
